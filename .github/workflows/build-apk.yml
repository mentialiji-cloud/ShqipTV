name: Build and Publish Shqip TV Next

on:
  push:
    branches: [main]
    paths:
      - "next/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare clean project
        run: |
          mkdir legacy
          unzip -q ShqipTV-Source-Eagle.zip -d legacy
          cp legacy/gradlew legacy/gradlew.bat next/
          cp -R legacy/gradle next/
          mkdir -p next/app/src/main/res/drawable
          cp legacy/app/src/main/res/drawable/app_banner.png next/app/src/main/res/drawable/app_banner.png
          for density in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "next/app/src/main/res/mipmap-$density"
            cp "legacy/app/src/main/res/mipmap-$density/ic_launcher_vault.png" "next/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          chmod +x next/gradlew

      - name: Build new fast APK
        working-directory: next
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Prepare APK
        run: cp next/app/build/outputs/apk/debug/app-debug.apk ShqipTV-v2.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShqipTV-v2-APK
          path: ShqipTV-v2.apk
          if-no-files-found: error

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Shqip TV 2.0 — New Fast App
          body: Completely rebuilt Android TV IPTV player with a lightweight architecture and fast remote navigation.
          files: ShqipTV-v2.apk
          make_latest: true
