name: Test EagleTV APK

on:
  pull_request:
    branches: [main]
    paths:
      - "EagleTV/**"
      - ".github/workflows/eagletv-pr-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build release APK
        run: |
          gradle -p EagleTV :app:assembleRelease --stacktrace
          cp EagleTV/app/build/outputs/apk/release/app-release.apk EagleTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EagleTV-beta
          path: EagleTV.apk
          if-no-files-found: error
          retention-days: 30
